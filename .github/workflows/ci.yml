name: CI

"on":
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agreement_intelligence_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agreement_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGREEMENT_INTELLIGENCE_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/agreement_intelligence_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.32
          enable-cache: true

      - name: Set up Python
        run: uv python install "$(cat .python-version)"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Install locked dependencies
        run: make setup

      - name: Audit JavaScript dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Run source checks
        run: make check

      - name: Validate local cloud infrastructure
        run: make terraform-check

      - name: Check whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
