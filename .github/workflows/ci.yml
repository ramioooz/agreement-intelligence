name: CI

"on":
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: agreement_intelligence_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agreement_intelligence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      localstack:
        image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        env:
          SERVICES: s3,sqs,secretsmanager
          AWS_DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl --fail --silent http://127.0.0.1:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AGREEMENT_INTELLIGENCE_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/agreement_intelligence_test
      REDIS_URL: redis://localhost:6379/0
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      LOCALSTACK_ENDPOINT: http://localhost:4566

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.32
          enable-cache: true

      - name: Set up Python
        run: uv python install "$(cat .python-version)"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.12.2

      - name: Install local infrastructure tools
        run: |
          uv tool install terraform-local==0.24.1
          uv tool install checkov==3.2.495

      - name: Install locked dependencies
        run: make setup

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high

      - name: Audit Python dependencies
        # The assisted evaluator uses only text metrics over an owner-supplied local JSON file.
        # PYSEC-2026-3046 is confined to unused multimodal URL/file retrieval; PYSEC-2026-2447
        # requires an attacker to already have write access to the ephemeral local cache directory.
        run: uv run pip-audit --ignore-vuln PYSEC-2026-3046 --ignore-vuln PYSEC-2026-2447

      - name: Run source checks
        run: make check

      - name: Run deterministic AI quality gate
        run: make ai-eval

      - name: Upload deterministic AI quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unified-ai-quality-report
          path: artifacts/evaluation/
          if-no-files-found: error

      - name: Validate local cloud infrastructure
        run: make terraform-check

      - name: Provision and inspect emulated infrastructure
        run: make terraform-provision-local

      - name: Check whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
