name: agreement-intelligence

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      APP_DB_NAME: ${APP_DB_NAME:?required}
      APP_DB_USER: ${APP_DB_USER:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?required}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: s3,sqs,secretsmanager
      AWS_DEFAULT_REGION: ${AWS_REGION:?required}
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          health="$$(curl --fail --silent
          http://127.0.0.1:4566/_localstack/health)"
          && printf '%s' "$$health" | grep -Eq '"s3":[[:space:]]*"(available|running)"'
          && printf '%s' "$$health" | grep -Eq '"sqs":[[:space:]]*"(available|running)"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:?required}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?required}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?required}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./docker/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      - sh
      - -c
      - >-
        alembic -c apps/api/alembic.ini upgrade head
        && python -m agreement_intelligence_api.identity.local_demo
        && exec uvicorn agreement_intelligence_api.main:app
        --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME}
      READINESS_CHECK_DATABASE_CONNECTIVITY: "true"
      AWS_REGION: ${AWS_REGION:?required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?required}
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_DOCUMENT_BUCKET: ${S3_DOCUMENT_BUCKET:?required}
      SQS_PROCESSING_QUEUE: ${SQS_PROCESSING_QUEUE:?required}
      SQS_NOTIFICATION_QUEUE: ${SQS_NOTIFICATION_QUEUE:?required}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_FALLBACK_MODEL: ${EMBEDDING_FALLBACK_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_INDEX_VERSION: ${EMBEDDING_INDEX_VERSION:-embedding-v1}
      EMBEDDING_CONFIG_VERSION: ${EMBEDDING_CONFIG_VERSION:-embedding-gateway.v1}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      EMBEDDING_INPUT_COST_PER_MILLION_TOKENS: ${EMBEDDING_INPUT_COST_PER_MILLION_TOKENS:-0.02}
      MODEL_GATEWAY_MODE: ${MODEL_GATEWAY_MODE:-openai}
      MODEL_GATEWAY_MODEL: ${MODEL_GATEWAY_MODEL:-}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-}
      MODEL_GATEWAY_CONFIG_VERSION: ${MODEL_GATEWAY_CONFIG_VERSION:-model-gateway.v1}
      MODEL_GATEWAY_INPUT_COST_PER_MILLION_TOKENS: ${MODEL_GATEWAY_INPUT_COST_PER_MILLION_TOKENS:-}
      MODEL_GATEWAY_OUTPUT_COST_PER_MILLION_TOKENS: ${MODEL_GATEWAY_OUTPUT_COST_PER_MILLION_TOKENS:-}
      MODEL_GATEWAY_FALLBACK_MODE: ${MODEL_GATEWAY_FALLBACK_MODE:-}
      MODEL_GATEWAY_FALLBACK_MODEL: ${MODEL_GATEWAY_FALLBACK_MODEL:-}
      AI_MONTHLY_TOKEN_BUDGET: ${AI_MONTHLY_TOKEN_BUDGET:-1000000}
      AI_MONTHLY_COST_BUDGET_USD: ${AI_MONTHLY_COST_BUDGET_USD:-25}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:?required}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:?required}
      APPLICATION_LOG_RETENTION_DAYS: ${APPLICATION_LOG_RETENTION_DAYS:?required}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/${KEYCLOAK_REALM:?required}
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?required}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?required}
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?required}
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?required}
      DEMO_REVIEWER_SUBJECT: ${DEMO_REVIEWER_SUBJECT:?required}
      DEMO_REVIEWER_USERNAME: ${DEMO_REVIEWER_USERNAME:?required}
      DEMO_REVIEWER_EMAIL: ${DEMO_REVIEWER_EMAIL:?required}
      DEMO_REVIEWER_FIRST_NAME: ${DEMO_REVIEWER_FIRST_NAME:?required}
      DEMO_REVIEWER_LAST_NAME: ${DEMO_REVIEWER_LAST_NAME:?required}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:?required}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:?required}
      DEMO_ADMIN_FIRST_NAME: ${DEMO_ADMIN_FIRST_NAME:?required}
      DEMO_ADMIN_LAST_NAME: ${DEMO_ADMIN_LAST_NAME:?required}
      DEMO_BUSINESS_APPROVER_SUBJECT: ${DEMO_BUSINESS_APPROVER_SUBJECT:?required}
      DEMO_BUSINESS_APPROVER_USERNAME: ${DEMO_BUSINESS_APPROVER_USERNAME:?required}
      DEMO_BUSINESS_APPROVER_EMAIL: ${DEMO_BUSINESS_APPROVER_EMAIL:?required}
      DEMO_BUSINESS_APPROVER_FIRST_NAME: ${DEMO_BUSINESS_APPROVER_FIRST_NAME:?required}
      DEMO_BUSINESS_APPROVER_LAST_NAME: ${DEMO_BUSINESS_APPROVER_LAST_NAME:?required}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
      localstack-bootstrap:
        condition: service_completed_successfully
      keycloak-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2));
          assert data['status']=='ok'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME}
      AWS_REGION: ${AWS_REGION:?required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?required}
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_DOCUMENT_BUCKET: ${S3_DOCUMENT_BUCKET:?required}
      SQS_PROCESSING_QUEUE: ${SQS_PROCESSING_QUEUE:?required}
      SQS_NOTIFICATION_QUEUE: ${SQS_NOTIFICATION_QUEUE:?required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LANGFUSE_OTLP_ENDPOINT: ${LANGFUSE_OTLP_ENDPOINT:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:?required}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:?required}
      APPLICATION_LOG_RETENTION_DAYS: ${APPLICATION_LOG_RETENTION_DAYS:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_FALLBACK_MODEL: ${EMBEDDING_FALLBACK_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_INDEX_VERSION: ${EMBEDDING_INDEX_VERSION:-embedding-v1}
      EMBEDDING_CONFIG_VERSION: ${EMBEDDING_CONFIG_VERSION:-embedding-gateway.v1}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      EMBEDDING_INPUT_COST_PER_MILLION_TOKENS: ${EMBEDDING_INPUT_COST_PER_MILLION_TOKENS:-0.02}
      MODEL_GATEWAY_MODE: ${MODEL_GATEWAY_MODE:-openai}
      MODEL_GATEWAY_MODEL: ${MODEL_GATEWAY_MODEL:-}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-}
      MODEL_GATEWAY_CONFIG_VERSION: ${MODEL_GATEWAY_CONFIG_VERSION:-model-gateway.v1}
      MODEL_GATEWAY_INPUT_COST_PER_MILLION_TOKENS: ${MODEL_GATEWAY_INPUT_COST_PER_MILLION_TOKENS:-}
      MODEL_GATEWAY_OUTPUT_COST_PER_MILLION_TOKENS: ${MODEL_GATEWAY_OUTPUT_COST_PER_MILLION_TOKENS:-}
      MODEL_GATEWAY_FALLBACK_MODE: ${MODEL_GATEWAY_FALLBACK_MODE:-}
      MODEL_GATEWAY_FALLBACK_MODEL: ${MODEL_GATEWAY_FALLBACK_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      localstack-bootstrap:
        condition: service_completed_successfully
      keycloak-bootstrap:
        condition: service_completed_successfully
    stop_grace_period: 15s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-b9445@sha256:8dd148c53936b6e8b0e75309841e66eab13adc50b004a5e86ab1fec477c17d8e
    profiles: ["local-model"]
    command:
      - -m
      - /models/${LLAMA_CPP_GGUF_FILE:-provide-a-model.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "127.0.0.1:${LLAMA_CPP_PORT:-8081}:8080"
    volumes:
      - type: bind
        source: ${LLAMA_CPP_MODEL_DIR:-./local-models}
        target: /models
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB_NAME}
      AWS_REGION: ${AWS_REGION:?required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?required}
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_DOCUMENT_BUCKET: ${S3_DOCUMENT_BUCKET:?required}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/${KEYCLOAK_REALM:?required}
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?required}
      MCP_PUBLIC_URL: http://localhost:${MCP_PORT:-8001}/mcp
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:?required}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:?required}
      APPLICATION_LOG_RETENTION_DAYS: ${APPLICATION_LOG_RETENTION_DAYS:?required}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:${MCP_PORT:-8001}:8001"
    depends_on:
      api:
        condition: service_healthy
      otel-collector:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      AUTH_SECRET: ${AUTH_SECRET:?required}
      AUTH_URL: ${WEB_PUBLIC_ORIGIN:?required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?required}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/${KEYCLOAK_REALM:?required}
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}
      API_ORGANIZATION_ID: ${API_ORGANIZATION_ID:?required}
      API_WORKSPACE_ID: ${API_WORKSPACE_ID:?required}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000')
          .then(r=>{if(!r.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  localstack-bootstrap:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    entrypoint: ["/bootstrap.sh"]
    command: ["apply"]
    environment:
      LOCALSTACK_ENDPOINT: http://localstack:4566
      AWS_REGION: ${AWS_REGION:?required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?required}
      S3_DOCUMENT_BUCKET: ${S3_DOCUMENT_BUCKET:?required}
      SQS_PROCESSING_QUEUE: ${SQS_PROCESSING_QUEUE:?required}
      SQS_PROCESSING_DLQ: ${SQS_PROCESSING_DLQ:?required}
      SQS_EXPORT_QUEUE: ${SQS_EXPORT_QUEUE:?required}
      SQS_EXPORT_DLQ: ${SQS_EXPORT_DLQ:?required}
      SQS_NOTIFICATION_QUEUE: ${SQS_NOTIFICATION_QUEUE:?required}
      SQS_NOTIFICATION_DLQ: ${SQS_NOTIFICATION_DLQ:?required}
    volumes:
      - ./docker/localstack/bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    entrypoint: ["/bootstrap.sh"]
    command: ["apply"]
    environment:
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?required}
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?required}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?required}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:?required}
      DEMO_REVIEWER_USERNAME: ${DEMO_REVIEWER_USERNAME:?required}
      DEMO_REVIEWER_SUBJECT: ${DEMO_REVIEWER_SUBJECT:?required}
      DEMO_REVIEWER_EMAIL: ${DEMO_REVIEWER_EMAIL:?required}
      DEMO_REVIEWER_FIRST_NAME: ${DEMO_REVIEWER_FIRST_NAME:?required}
      DEMO_REVIEWER_LAST_NAME: ${DEMO_REVIEWER_LAST_NAME:?required}
      DEMO_REVIEWER_PASSWORD: ${DEMO_REVIEWER_PASSWORD:?required}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:?required}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:?required}
      DEMO_ADMIN_FIRST_NAME: ${DEMO_ADMIN_FIRST_NAME:?required}
      DEMO_ADMIN_LAST_NAME: ${DEMO_ADMIN_LAST_NAME:?required}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?required}
      DEMO_BUSINESS_APPROVER_USERNAME: ${DEMO_BUSINESS_APPROVER_USERNAME:?required}
      DEMO_BUSINESS_APPROVER_SUBJECT: ${DEMO_BUSINESS_APPROVER_SUBJECT:?required}
      DEMO_BUSINESS_APPROVER_EMAIL: ${DEMO_BUSINESS_APPROVER_EMAIL:?required}
      DEMO_BUSINESS_APPROVER_FIRST_NAME: ${DEMO_BUSINESS_APPROVER_FIRST_NAME:?required}
      DEMO_BUSINESS_APPROVER_LAST_NAME: ${DEMO_BUSINESS_APPROVER_LAST_NAME:?required}
      DEMO_BUSINESS_APPROVER_PASSWORD: ${DEMO_BUSINESS_APPROVER_PASSWORD:?required}
    volumes:
      - ./docker/keycloak/bootstrap.sh:/bootstrap.sh:ro
      - ./docker/keycloak/ClientAttributes.java:/ClientAttributes.java:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
