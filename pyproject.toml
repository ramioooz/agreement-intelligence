[project]
name = "agreement-intelligence"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
  "boto3-stubs[s3]==1.43.60",
  "httpx2==2.9.1",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/mcp", "apps/worker", "packages/platform-core"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = [
  "apps/api/tests",
  "apps/mcp/tests",
  "apps/worker/tests",
  "packages/platform-core/tests",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
