[project]
name = "agreement-intelligence"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
  "boto3-stubs[s3]==1.43.83",
  "httpx2==2.12.0",
  "langchain-community==0.4.2",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ragas==0.4.3",
  "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/mcp", "apps/worker", "packages/platform-core"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
testpaths = [
  "apps/api/tests",
  "apps/mcp/tests",
  "apps/worker/tests",
  "packages/platform-core/tests",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
exclude = "^apps/(api|worker)/tests/test_ai_configuration\\.py$"
