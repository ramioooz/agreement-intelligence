[project]
name = "agreement-intelligence-worker"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "boto3==1.43.60",
  "psycopg[binary]==3.2.9",
  "pypdf>=6.14.2",
  "python-docx>=1.2.0",
  "sqlalchemy==2.0.46",
]

[project.scripts]
agreement-worker = "agreement_intelligence_worker.main:main"

[build-system]
requires = ["uv_build==0.11.32"]
build-backend = "uv_build"
