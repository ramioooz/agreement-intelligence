[project]
name = "agreement-intelligence-api"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "alembic==1.16.4",
  "boto3==1.43.60",
  "agreement-intelligence-worker>=0.1.0",
  "fastapi==0.140.0",
  "fpdf2==2.8.7",
  "pymupdf-fonts==1.0.5",
  "psycopg[binary]==3.2.9",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "opentelemetry-api==1.38.0",
  "opentelemetry-sdk==1.38.0",
  "redis==6.4.0",
  "sqlalchemy==2.0.46",
  "uharfbuzz==0.56.0",
  "uvicorn[standard]==0.51.0",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
]

[tool.uv.sources]
agreement-intelligence-worker = { workspace = true }

[build-system]
requires = ["uv_build==0.11.32"]
build-backend = "uv_build"
